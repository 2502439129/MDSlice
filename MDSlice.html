<header class="topbar">
  <button class="tbtn menu-btn" id="menuBtn">☰ 目录</button>
  <!-- 品牌标题：常驻顶栏左侧，位于首页标签之前 -->
  <span class="brand">MDSlice</span>
  <div class="tabbar" id="tabbar"></div>
  <span class="spacer"></span>
  <button class="tbtn" id="fileBtn">打开 MD</button>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
  <input type="file" id="dirInput" webkitdirectory hidden>
  <button class="tbtn" id="themeBtn">◐ 暗色</button>
</header>

<div class="shell" id="shell">
  <nav class="sidebar" id="sidebar">
    <div class="nav-h1">
      <span>目录</span>
      <span class="nav-acts">
        <button type="button" class="nav-act" data-action="collapse" title="折叠全部目录">全部折叠</button>
        <button type="button" class="nav-act" data-action="expand" title="展开全部目录">全部展开</button>
      </span>
    </div>
    <!-- 每个标签页一棵目录树，未激活的 display:none（折叠状态随各自 DOM 保留） -->
    <div class="nav-panes" id="navPanes"></div>
  </nav>
  <div class="resizer" id="resizer" title="拖动调整目录宽度"></div>
  <!-- 每个标签页一个 .pane，未激活的 display:none（滚动位置、展开态随各自 DOM 保留） -->
  <main id="content"></main>
  <aside class="toc" id="tocAside" hidden>
    <h4>本章目录</h4>
    <div class="toc-panes" id="tocPanes"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<!-- 数学公式：先建立配置对象（03-render.js 的 renderMath 依赖它），再加载库本体。
     不用 MathJax 的定界符扫描：$$ 与 $ 的识别完全由 js/02-markdown.js 负责
     （行内要求 $ 前后是空白、行首行尾或强调标记），排版时按元素的 data-tex 调用 tex2chtml，
     所以这里关掉启动扫描与全部定界符。 -->
<script>
window.MathJax = {
  startup: { typeset: false },
  tex: { inlineMath: [], displayMath: [] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
<!-- 逻辑按职责拆分：共享全局作用域（不用 ES module，否则 file:// 直开会因 CORS 被拦），顺序即依赖 -->
<script src="js/01-core.js"></script>
<script src="js/02-markdown.js"></script>
<script src="js/03-render.js"></script>
<script src="js/04-tabs.js"></script>
<script src="js/05-shell.js"></script>
<script src="js/06-dirs.js"></script>
<script src="js/07-home.js"></script>
<script src="js/08-boot.js"></script>

</body>
</html>
